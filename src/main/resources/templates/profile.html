<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile | Staywise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{layout :: sidebar('Profile')}"></div><main class="main-area"><div th:replace="~{layout :: topbar('My profile')}"></div><div class="page-content"><div th:replace="~{layout :: alerts}"></div><div class="page-intro"><div><h2>Personal details</h2><p>Keep your contact information up to date.</p></div></div><section class="panel form-panel profile-panel"><div class="profile-hero"><div class="profile-avatar" th:text="${#strings.substring(student.fullName,0,1)}">S</div><div><h2 th:text="${student.fullName}">Student Name</h2><p th:text="${student.studentId}">STU1001</p><span class="status status-blue" th:text="${student.applicationStatus}">Application</span></div></div><form action="/profile" method="post" class="form-grid"><div><label>Email</label><input name="email" type="email" th:value="${student.email}" required></div><div><label>Phone</label><input name="phone" th:value="${student.phone}" required></div><div><label>Course</label><input name="course" th:value="${student.course}" required></div><div><label>Year</label><input th:value="${student.yearOfStudy}" disabled></div><div><label>Room number</label><input th:value="${student.roomNumber==null?'Not assigned':student.roomNumber}" disabled></div><div><label>Fee status</label><input th:value="${student.feeStatus}" disabled></div><div class="form-span"><button class="btn primary">Save profile</button></div></form><hr><div class="panel-head"><div><h3>Hostel application</h3><p class="muted">Submit your application for warden review and room allocation.</p></div></div><form action="/application" method="post"><button class="btn secondary">Submit / update application →</button></form></section><footer>Staywise · My profile</footer></div></main></div></body></html>
