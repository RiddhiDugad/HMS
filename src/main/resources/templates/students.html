<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Students | Staywise</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><div class="app-shell"><div th:replace="~{layout :: sidebar('Students')}"></div><main class="main-area"><div th:replace="~{layout :: topbar('Student directory')}"></div><div class="page-content"><div th:replace="~{layout :: alerts}"></div><div class="page-intro"><div><h2>Residents</h2><p>Student records, room assignments and fee status.</p></div><span class="count-chip" th:text="${#lists.size(students)}+' records'">0 records</span></div><section class="panel"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Course / Year</th><th>Room</th><th>Application</th><th>Fees</th><th>Action</th></tr></thead><tbody><tr th:each="st:${students}"><td><div class="person-cell"><div class="avatar table-avatar" th:text="${#strings.substring(st.fullName,0,1)}">S</div><div><b th:text="${st.fullName}">Name</b><small th:text="${st.email}">email</small></div></div></td><td th:text="${st.studentId}">ID</td><td><b th:text="${st.course}">Course</b><small class="table-sub" th:text="${st.yearOfStudy}">Year</small></td><td th:text="${st.roomNumber==null?'Not assigned':st.roomNumber}">—</td><td><span class="status status-blue" th:text="${st.applicationStatus}">Pending</span></td><td><span class="status" th:classappend="${st.feeStatus=='Paid'?' status-green':' status-amber'}" th:text="${st.feeStatus}">Pending</span></td><td><form th:if="${st.feeStatus!='Paid'}" th:action="@{/students/{id}/fee(id=${st.id})}" method="post"><button class="btn small-btn secondary">Mark paid</button></form><span th:if="${st.feeStatus=='Paid'}" class="muted">Complete</span></td></tr></tbody></table></div></section><footer>Staywise · Resident records</footer></div></main></div></body></html>
